<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img">
  <defs>
    <linearGradient id="heroScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3f2d"/>
      <stop offset="1" stop-color="#0f2a1d"/>
    </linearGradient>
    <path id="heroLeaf" d="M0 0C13-8 30-5 36 7 25 20 8 20 0 0Z"/>
  </defs>

  <!-- soft background shapes -->
  <circle cx="348" cy="286" r="214" fill="#eef2e3"/>
  <circle cx="480" cy="146" r="84" fill="#e3ebd5" opacity="0.9"/>
  <circle cx="140" cy="438" r="62" fill="#e3ebd5" opacity="0.75"/>
  <circle cx="522" cy="404" r="34" fill="#dfe8ce" opacity="0.9"/>

  <!-- decorative leaves (back layer) -->
  <g stroke="#315b3d" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M108 476c22-34 48-52 92-64"/>
    <path d="M528 424c6-34 22-54 50-68"/>
  </g>
  <g>
    <use href="#heroLeaf" transform="translate(108 474) rotate(-40) scale(1.28)" fill="#668b63"/>
    <use href="#heroLeaf" transform="translate(146 430) rotate(-14) scale(1.12)" fill="#8baf78"/>
    <use href="#heroLeaf" transform="translate(180 404) rotate(12) scale(0.95)" fill="#b5d957"/>
    <use href="#heroLeaf" transform="translate(196 438) rotate(34) scale(0.82)" fill="#668b63"/>
    <use href="#heroLeaf" transform="translate(528 420) rotate(-62) scale(1.16)" fill="#8baf78"/>
    <use href="#heroLeaf" transform="translate(548 384) rotate(-30) scale(1)" fill="#668b63"/>
    <use href="#heroLeaf" transform="translate(564 352) rotate(2) scale(0.82)" fill="#b5d957"/>
  </g>

  <!-- floating code badge -->
  <g>
    <rect x="92" y="112" width="78" height="78" rx="20" fill="#fffdf4" stroke="#dfe5d3"/>
    <text x="131" y="159" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="25" font-weight="700" fill="#315b3d">&lt;/&gt;</text>
  </g>

  <!-- floating sparkles -->
  <path d="M512 96l3.4 9.6 9.6 3.4-9.6 3.4-3.4 9.6-3.4-9.6-9.6-3.4 9.6-3.4z" fill="#b5d957"/>
  <path d="M112 262l2.4 6.8 6.8 2.4-6.8 2.4-2.4 6.8-2.4-6.8-6.8-2.4 6.8-2.4z" fill="#8baf78" opacity="0.85"/>

  <!-- laptop shadow -->
  <ellipse cx="320" cy="392" rx="152" ry="14" fill="#183629" opacity="0.07"/>

  <!-- laptop -->
  <g>
    <rect x="160" y="126" width="320" height="222" rx="20" fill="#183629"/>
    <rect x="173" y="139" width="294" height="196" rx="12" fill="url(#heroScreen)"/>

    <!-- code on screen -->
    <g font-family="'Plus Jakarta Sans', system-ui, sans-serif">
      <rect x="196" y="168" width="46" height="8" rx="4" fill="#b5d957"/>
      <rect x="250" y="168" width="68" height="8" rx="4" fill="#eaf2e7" opacity="0.75"/>
      <rect x="214" y="192" width="34" height="8" rx="4" fill="#8baf78"/>
      <rect x="256" y="192" width="56" height="8" rx="4" fill="#eaf2e7" opacity="0.6"/>
      <rect x="320" y="192" width="40" height="8" rx="4" fill="#b5d957" opacity="0.9"/>
      <rect x="214" y="216" width="62" height="8" rx="4" fill="#8baf78" opacity="0.9"/>
      <rect x="284" y="216" width="30" height="8" rx="4" fill="#eaf2e7" opacity="0.55"/>
      <rect x="196" y="240" width="40" height="8" rx="4" fill="#b5d957"/>
      <rect x="244" y="240" width="58" height="8" rx="4" fill="#eaf2e7" opacity="0.65"/>
      <rect x="214" y="264" width="70" height="8" rx="4" fill="#8baf78" opacity="0.85"/>
      <rect x="292" y="264" width="26" height="8" rx="4" fill="#eaf2e7" opacity="0.5"/>
      <rect x="196" y="288" width="22" height="8" rx="4" fill="#b5d957" opacity="0.8"/>
      <rect x="214" y="306" width="10" height="10" rx="2" fill="#b5d957"/>
    </g>

    <!-- javascript badge -->
    <rect x="386" y="272" width="44" height="44" rx="9" fill="#f7df1e"/>
    <text x="408" y="302" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#183629">JS</text>

    <!-- hinge + base -->
    <rect x="206" y="338" width="228" height="10" rx="5" fill="#264a31"/>
    <rect x="134" y="346" width="372" height="24" rx="12" fill="#315b3d"/>
    <rect x="154" y="356" width="332" height="8" rx="4" fill="#204832"/>
    <rect x="296" y="368" width="48" height="4" rx="2" fill="#183629" opacity="0.25"/>
  </g>

  <!-- foreground leaves -->
  <g stroke="#315b3d" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M560 306c-4-24-16-38-34-50"/>
  </g>
  <g>
    <use href="#heroLeaf" transform="translate(552 300) rotate(-90) scale(0.62)" fill="#b5d957"/>
    <use href="#heroLeaf" transform="translate(534 268) rotate(-60) scale(0.7)" fill="#8baf78"/>
  </g>
</svg>
