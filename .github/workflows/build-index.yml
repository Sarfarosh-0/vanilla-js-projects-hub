name: Build Project Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate project index and landing page
        run: node scripts/build-index.js

      - name: Commit and push generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain README.md index.html)" ]; then
            git add README.md index.html
            git commit -m "docs: regenerate project index [skip ci]"
            git push
          else
            echo "README.md and index.html are up to date."
          fi
